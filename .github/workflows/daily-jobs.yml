name: Daily jobs
on:
  push:
    paths:
      - 'public/data/discovery.json'
      - 'config/profile.json'
      - 'config/sources.json'
      - 'src/jobhub/**'
      - 'tests/**'
      - '.github/workflows/daily-jobs.yml'
  workflow_dispatch:
  schedule:
    - cron: '15 6 * * *'
    - cron: '15 7 * * *'
permissions:
  contents: write
concurrency:
  group: job-hub-daily-${{ github.ref }}
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/cache@v4
        with:
          path: .cache/jobhub
          key: job-hub-source-cache-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            job-hub-source-cache-${{ github.ref_name }}-
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
      - run: python -m src.jobhub.run
      - name: Commit public feed
        run: |
          git config user.name "job-hub-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data
          git diff --cached --quiet || git commit -m "data: refresh jobs"
          git push
